<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Survival League</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07120e;--panel:#0f2118;--panel2:#142b21;--line:#294335;--ink:#f3f7f1;--muted:#a9b7ad;--lime:#c9f752;--danger:#ff806f;--gold:#f8c65a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 85% -10%,#244e38 0,transparent 32%),var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:1180px;margin:auto;padding:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.02em}
.crest{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--lime);border-radius:12px;color:var(--lime);font-size:20px}
.build-tag{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.03em;margin-left:6px}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px}
.tab.active{background:var(--lime);color:#10200f}
.card{background:linear-gradient(145deg,#142a20,#0d1d16);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 14px 32px #00000024}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.section-title h2{font-size:18px;margin:0}
.tag{background:#c9f75218;color:var(--lime);padding:5px 10px;border-radius:999px;font-weight:750;font-size:12px;white-space:nowrap}
.tag.danger{background:#ff806f22;color:var(--danger)}
.tag.gold{background:#f8c65a22;color:var(--gold)}
select,input[type=text],input[type=password],input[type=number],input[type=datetime-local]{width:100%;background:#0b1812;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:14px}
input.pin-input{letter-spacing:8px;font-size:20px;text-align:center;font-weight:800}
label.field{display:block;margin-bottom:12px}
label.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.team{position:relative;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#0b1812;cursor:pointer;transition:.15s;text-align:center}
.team:hover{border-color:#628c70}
.team input{position:absolute;opacity:0}
.team:has(input:checked){border-color:var(--lime);background:#c9f75212;box-shadow:inset 0 0 0 1px var(--lime)}
.team.used{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.team b{font-size:13.5px;font-weight:700}
.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--lime);color:#10200f;font:800 14px inherit;cursor:pointer}
.btn:hover{background:#dbff75}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger);color:#2a0a06}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:9px}
.counter{font-size:44px;font-weight:850;letter-spacing:-.05em;line-height:1}
.counter small{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:0}
.progress{height:8px;background:#07120e;border-radius:99px;overflow:hidden;margin:14px 0 6px}
.progress i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:.4s}
.small{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;margin:2px}
.chip.win{background:#c9f75222;color:var(--lime)}
.chip.draw{background:#f8c65a22;color:var(--gold)}
.chip.loss{background:#ff806f22;color:var(--danger)}
.chip.avail{background:#a9b7ad18;color:var(--muted)}
.chip.pending{background:#f8c65a22;color:var(--gold)}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.two-col{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}
.hidden{display:none !important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--lime);color:#122012;font-weight:800;padding:12px 18px;border-radius:11px;box-shadow:0 12px 30px #0008;display:none;z-index:50}
.toast.show{display:block}
.lock{border:1px dashed #486153;border-radius:13px;padding:16px;color:var(--muted)}
.lock b{display:block;color:var(--ink);margin-bottom:4px}
.lock.danger{border-color:#ff806f66}
.life{display:flex;gap:10px;align-items:flex-start;margin:14px 0;padding:13px;border-radius:12px;background:#0b1812;border:1px solid var(--line)}
.life input{accent-color:var(--lime);width:17px;height:17px;margin-top:2px}
.life p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.badge-elim{background:#ff806f22;color:var(--danger);padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.badge-alive{background:#c9f75222;color:var(--lime);padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.badge-open{background:#a9b7ad22;color:var(--muted);padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.badge-claimed{background:#c9f75222;color:var(--lime);padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.badge-missed{background:#ff806f22;color:var(--danger);padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.rules-list{margin:0;padding:0;counter-reset:rule}
.rule-item{list-style:none;counter-increment:rule;display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.rule-item:last-child{border-bottom:none}
.rule-num{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:#c9f75218;color:var(--lime);font-weight:800;display:grid;place-items:center;font-size:13px}
.rule-body b{display:block;margin-bottom:2px}
.rule-body span{color:var(--muted);font-size:13.5px}
.entry-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#f8c65a14;border:1px solid #f8c65a3a;border-radius:14px;padding:14px 16px;margin-bottom:18px}
.entry-banner b{color:var(--gold);font-size:15px}
.name-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.name-chip{border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:#0b1812;cursor:pointer;text-align:center;font-weight:700;font-size:13.5px;transition:.15s}
.name-chip:hover{border-color:var(--lime);background:#c9f75212}
.authwrap{max-width:640px;margin:40px auto}
.authcard{text-align:center}
.authcard .crest{margin:0 auto 14px}
.switcher{display:flex;gap:6px;background:#0b1812;border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px}
.switcher .stab{flex:1;text-align:center;padding:9px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px}
.switcher .stab.active{background:var(--lime);color:#10200f}
.userchip{display:flex;align-items:center;gap:8px;background:#0b1812;border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700}
.countdown{font-size:13px;font-weight:800;padding:5px 11px;border-radius:99px}
.countdown.ok{background:#c9f75222;color:var(--lime)}
.countdown.warn{background:#f8c65a22;color:var(--gold)}
.countdown.over{background:#ff806f22;color:var(--danger)}
.ledger-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff55;border-top-color:#10200f;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.fairplay{border:1px solid #ff806f55;background:linear-gradient(145deg,#2a1310,#1a0d0b);border-radius:16px;padding:18px;margin-bottom:16px}
.fairplay b{color:var(--danger);display:block;font-size:15px;margin-bottom:6px}
.fairplay p{margin:0 0 12px;color:#e9c9c3;font-size:13.5px}
.fairplay .btn{width:auto}
.democracy{font-size:12px;color:var(--lime);font-weight:800;text-align:center;margin-top:10px;letter-spacing:.02em}
.tz-note{font-size:12px;color:var(--muted);margin-top:6px}
.deny{text-align:center;padding:40px 20px}
.deny .crest{margin:0 auto 14px;opacity:.6}
.current-pick-box{border:1px solid #f8c65a55;background:#f8c65a0f;border-radius:13px;padding:14px 16px;margin-bottom:16px}
.current-pick-box b{color:var(--gold);display:block;margin-bottom:4px}
@media(max-width:780px){.two-col,.row,.ledger-cols{grid-template-columns:1fr}.teams,.name-grid{grid-template-columns:repeat(2,1fr)}.shell{padding:15px}table{font-size:12px}th,td{padding:7px 5px}}
</style>
</head>
<body>
<main class="shell">

  <div id="loadingScreen" class="authwrap">
    <div class="card authcard"><div class="crest">♛</div><p class="small" style="margin-top:10px">Connecting to the league…</p></div>
  </div>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="hidden">
    <header class="top"><div class="brand"><div class="crest">♛</div> SURVIVAL LEAGUE <span class="build-tag">build 2026-08-21.2</span></div></header>
    <div class="authwrap">
      <div class="card authcard">
        <div class="crest">♛</div>
        <h2 style="margin:6px 0 2px">Join the league</h2>
        <p class="small">Claim your name once, set a 4-digit PIN, and you're in for the season.</p>
        <div class="switcher">
          <div class="stab active" data-stab="claim">Claim my name</div>
          <div class="stab" data-stab="login">I already signed up</div>
        </div>
        <div id="claimPane">
          <p class="small" id="claimHint" style="margin-bottom:10px">Tap your name below. Names already signed up are removed from this list automatically.</p>
          <div class="name-grid" id="openNamesGrid"></div>
          <div id="pinSetup" class="hidden"
